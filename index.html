x}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 5px 20px #1e293b08}.stat{display:flex;justify-content:space-between;align-items:center}.stat .n{font-size:28px;font-weight:800;margin-top:6px}.icon{width:44px;height:44px;border-radius:13px;background:#eef2ff;display:grid;place-items:center}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:600}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}.btn.success{background:#d1fae5;color:#065f46}.btn.warning{background:#fef3c7;color:#92400e}.btn.dark{background:#1f2937}.btn.small{padding:7px 10px;font-size:12px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dbe1ea;border-radius:10px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51a}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.formgrid.three{grid-template-columns:repeat(3,1fr)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.actions{display:flex;gap:6px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.badge.green{background:#d1fae5;color:#065f46}.badge.red{background:#fee2e2;color:#991b1b}.badge.blue{background:#dbeafe;color:#1e40af}.notice{padding:11px 13px;border-radius:10px;margin-bottom:15px}.notice.success{background:#d1fae5;color:#065f46}.notice.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:35px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:20px;z-index:50}.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f9;border-radius:9px;padding:7px 11px}.quote-items{border:1px solid var(--border);border-radius:12px;overflow:hidden}.quote-row{display:grid;grid-template-columns:2fr .7fr 1fr .8fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--border)}.quote-row:last-child{border:0}.quote-row.header{background:#f8fafc;font-size:12px;font-weight:700;color:var(--muted)}.quote-summary{display:flex;justify-content:flex-end;margin-top:15px}.summary-box{min-width:260px}.sum{display:flex;justify-content:space-between;padding:5px 0}.sum.total{font-size:20px;font-weight:800;border-top:1px solid var(--border);margin-top:5px;padding-top:10px}.preview{background:#fff;padding:35px;max-width:900px;margin:auto}.preview-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--primary);padding-bottom:18px}.preview table{width:100%;border-collapse:collapse;margin-top:25px}.preview th,.preview td{border-bottom:1px solid #ddd;padding:9px;text-align:left}.preview-total{margin-left:auto;width:280px;margin-top:20px}.mobile-menu{display:none}.invoice-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.invoice-parties>div{border:1px solid var(--border);border-radius:12px;padding:15px}.invoice-footer{margin-top:70px;text-align:center;color:#777;border-top:1px solid var(--border);padding-top:15px}@page{size:A4;margin:8mm}@media print{html,body{width:210mm;min-height:297mm;background:#fff!important;margin:0!important;padding:0!important}.no-print,.side,.top,#loginPage,.modal{display:none!important}.app{display:block!important;min-height:0!important}.main <script>
const KEY='caripro_data';
const LEGACY_KEYS=['caripro_v2_data','caripro_data_v2'];
const SCHEMA_VERSION=72;
const defaults={brand:'ÖzSoft',company:'Benim Firmam',contactName:'',logo:'',taxNo:'',taxOffice:'',phone:'',email:'',address:'',vat:20,currency:'TRY',users:[{id:1,username:'admin',password:'admin123',role:'admin',name:'Yönetici',active:true,defaultAdmin:true}],accounts:[],materials:[],movements:[],quotes:[],invoices:[],payments:[]};
let D=load(), current=null, page='home';
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizeData(raw){let d={...clone(defaults),...(raw||{})};
  d.users=Array.isArray(d.users)?d.users:clone(defaults.users); d.accounts=Array.isArray(d.accounts)?d.accounts:[]; d.materials=Array.isArray(d.materials)?d.materials:[]; d.movements=Array.isArray(d.movements)?d.movements:[]; d.quotes=Array.isArray(d.quotes)?d.quotes:[]; d.invoices=Array.isArray(d.invoices)?d.invoices:[]; d.payments=Array.isArray(d.payments)?d.payments:[];
  d.brand='ÖzSoft'; if(!d.logo)d.logo=''; d.schemaVersion=SCHEMA_VERSION; return d;
}
function load(){
  try{
    let raw=localStorage.getItem(KEY), migrated=false;
    if(!raw){for(const k of LEGACY_KEYS){const old=localStorage.getItem(k);if(old){raw=old;migrated=true;break}}}
    let parsed=raw?JSON.parse(raw):null;
    let wasV5=!!parsed && Number(parsed.schemaVersion||5)<6;
    let d=normalizeData(parsed);
    if(!d.users.length)d.users=clone(defaults.users);
    if(wasV5)migrateV5ToV6(d);
    if(migrated||wasV5)localStorage.setItem(KEY,JSON.stringify(d));
    return d;
  }catch(e){return clone(defaults)}
}
function migrateV5ToV6(d){
  /* V5 stok hareketlerinde alış ve satış yönü ters uygulanıyordu.
     Mevcut stok bakiyesini, V5'teki hareketlerin yanlış etkisini geri alarak
     V6'nın doğru yönüne çeviriyoruz. Açılış/mevcut stok korunur. */
  (d.materials||[]).forEach(mat=>{
    let netV5=(d.movements||[]).filter(m=>m.materialId===mat.id)
      .reduce((s,m)=>s+(m.type==='Çıkış / Satış'?Number(m.qty||0):-Number(m.qty||0)),0);
    mat.stock=Number(mat.stock||0)-(2*netV5);
  });
  d.schemaVersion=6;
}
function accountBalanceLabel(a,type){
  let b=Number(a?.balance||0);
  if(type==='Ödeme') return b<0?`Borç: ${money(Math.abs(b))}`:'Borç: 0,00 '+D.currency;
  return b>0?`Alacak: ${money(b)}`:'Alacak: 0,00 '+D.currency;
}
function paymentAccountOptions(type,selectedId=''){
  return D.accounts.filter(a=>type==='Tahsilat'?a.kind==='Müşteri':a.kind==='Tedarikçi')
    .map(a=>`<option value="${a.id}" ${a.id==selectedId?'selected':''}>${esc(a.code)} - ${esc(a.name)} (${accountBalanceLabel(a,type)})</option>`).join('');
}
function paymentTotals(){
  let receivable=D.accounts.filter(a=>a.kind==='Müşteri'&&Number(a.balance)>0).reduce((s,a)=>s+Number(a.balance||0),0);
  let debt=Math.abs(D.accounts.filter(a=>a.kind==='Tedarikçi'&&Number(a.balance)<0).reduce((s,a)=>s+Number(a.balance||0),0));
  return {receivable,debt};
}
function updatePaymentForm(){
  let type=v('p_type'), selected=+v('p_account')||0;
  let accountEl=document.getElementById('p_account');
  if(accountEl)accountEl.innerHTML=paymentAccountOptions(type,selected);

  let invoiceEl=document.getElementById('p_invoice');
  let invoiceField=document.getElementById('paymentInvoiceField');
  if(invoiceEl){
    let accountId=+v('p_account')||0;
    if(type==='Tahsilat'){
      invoiceEl.innerHTML='<option value="">Fatura seçmeden genel tahsilat</option>'+
        D.invoices.filter(x=>x.accountId===accountId && Math.max(0,x.total-(x.paid||0))>0)
        .map(x=>`<option value="${x.id}">${esc(x.no)} — Kalan ${money(Math.max(0,x.total-(x.paid||0)))}</option>`).join('');
      if(invoiceField) invoiceField.style.display='';
    }else{
      invoiceEl.innerHTML='<option value="">Ödeme işlemlerinde fatura bağlantısı yok</option>';
      invoiceEl.value='';
      if(invoiceField) invoiceField.style.display='none';
    }
  }

  let hint=document.getElementById('paymentBalanceHint');
  if(hint){
    let a=D.accounts.find(x=>x.id===selected);
    hint.innerHTML=a?`<b>${esc(a.name)}</b> — ${accountBalanceLabel(a,type)}`:'';
  }
  let title=document.getElementById('paymentActionTitle');
  if(title)title.textContent=type==='Tahsilat'?'Tahsilat Al':'Ödeme Yap';
  let btn=document.getElementById('paymentSaveBtn');
  if(btn){btn.className='btn '+(type==='Tahsilat'?'success':'warning');btn.textContent=type==='Tahsilat'?'Tahsilatı Kaydet':'Ödemeyi Kaydet'}
}
function paymentInvoiceSelected(){
  let invoiceId=+v('p_invoice')||0;
  if(!invoiceId)return;
  let inv=D.invoices.find(x=>x.id===invoiceId);
  if(!inv)return;
  let remaining=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
  let amountEl=document.getElementById('p_amount');
  if(amountEl) amountEl.value=remaining.toFixed(2);
}

function save(){
  try{const previous=localStorage.getItem(KEY);if(previous)localStorage.setItem('caripro_auto_recovery',previous);localStorage.setItem(KEY,JSON.stringify(normalizeData(D)))}catch(e){alert('Veriler kaydedilemedi. Tarayıcı depolama alanı dolu olabilir. Lütfen Yedek Al ile verilerinizi dışarı aktarın.')}}
function downloadBlob(filename,text,type='application/json'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backupData(){const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');const payload={app:'ÖzSoft',schemaVersion:SCHEMA_VERSION,backupDate:new Date().toISOString(),data:normalizeData(D)};downloadBlob(`OzSoft_Yedek_${stamp}.json`,JSON.stringify(payload,null,2));alert('Yedek dosyası hazırlandı ve indirildi. Bu dosyayı güvenli bir yerde saklayabilirsiniz.')}
function restoreData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);const incoming=payload.data||payload;if(!incoming||!Array.isArray(incoming.users)||!Array.isArray(incoming.accounts)||!Array.isArray(incoming.materials)||!Array.isArray(incoming.movements)||!Array.isArray(incoming.quotes))throw new Error('Geçersiz yedek');
      localStorage.setItem('caripro_before_restore',JSON.stringify(D));let incomingVersion=Number(incoming.schemaVersion||5);D=normalizeData(incoming);if(incomingVersion<6)migrateV5ToV6(D);save();current=null;alert('Yedek başarıyla geri yüklendi ve V6 kuralları uygulandı. Uygulama yeniden açılacak.');location.reload();
    }catch(err){alert('Yedek dosyası okunamadı veya geçersiz. Lütfen ÖzSoft tarafından oluşturulmuş bir .json yedeği seçin.')}};reader.readAsText(file);event.target.value=''}

}

  renderMovementLines();
}
function removeMovementLine(i){if(movementDraft.length===1)return;movementDraft.splice(i,1);renderMovementLines()}
function openMultiMovement(){

  openMovement(); setTimeout(()=>{renderMovementLines()},0);
}

function openMovement(i){
  movementDraft=i?[]:[];
  let m=movementState(D.movements.find(x=>x.id===i));
  let initialType=m.type==='Giriş / Alış'?'Giriş / Alış':'Çıkış / Satış';
  let allowed=D.accounts.filter(a=>initialType==='Giriş / Alış'?a.kind==='Tedarikçi':a.kind==='Müşteri');
  if(!allowed.some(a=>a.id===m.accountId))m.accountId=allowed[0]?.id||'';

  modal(`<h3>${i?'Hareket Düzenle':'Yeni Stok Hareketi'}</h3>
  <div class="formgrid">
    <div class="field"><label>Tarih</label><input id="mv_date" type="date" value="${m.date}"></div>
    <div class="field"><label>İşlem</label><select id="mv_type" onchange="movementAccountOptions();movementMaterialPrice();renderMovementLines()"><option ${m.type==='Çıkış / Satış'?'selected':''}>Çıkış / Satış</option><option ${m.type==='Giriş / Alış'?'selected':''}>Giriş / Alış</option></select></div>
    <div class="field"><label>Cari</label><select id="mv_account">${allowed.map(a=>`<option value="${a.id}" ${a.id===m.accountId?'selected':''}>${esc(a.code)} - ${esc(a.name)}</option>`).join('')}</select></div>
    <div class="field"><label>KDV %</label><input id="mv_vat" type="number" step="0.01" value="${m.vat}"></div>
    <div class="field"><label>Belge No</label><input id="mv_doc" value="${esc(m.doc)}"></div>
  </div>
  <div class="field"><label>Açıklama</label><textarea id="mv_desc">${esc(m.desc)}</textarea></div>
  <div class="v63-movement-actions">
    <div class="hint">Cariyi yukarıdan bir kez seçin; + Ürün Ekle ile malzeme listesinden seçim yapın. Tüm kalemler aynı cariye işlenir.</div>
    <button type="button" class="btn secondary" onclick="addMovementLine()">+ Ürün Ekle</button>
  </div>
  <div class="movement-editor-card">
    <div class="movement-editor-head">
      <span>#</span><span>Malzeme</span><span>Miktar</span><span>Birim Fiyat</span><span></span>
    </div>
    <div id="movementLines" class="movement-lines"></div>
    <div id="movementEditorTotal" class="movement-editor-total">Toplam: 0,00</div>
  </div>
  <div class="toolbar"><button class="btn" onclick="saveMovement(${i||0})">Kaydet</button><button class="btn secondary" onclick="closeModal()">Vazgeç</button></div>`);

  if(i){
    const old=D.movements.find(x=>x.id===i);
    if(old){
      movementDraft=[{
        materialId:old.materialId,
        qty:old.qty,
        price:old.price
      }];
    }
  }
  setTimeout(()=>renderMovementLines(),0);
}
function movementAccountOptions(){
  let type=v('mv_type'), sel=+v('mv_account')||0, el=document.getElementById('mv_account');
  if(!el)return;
  let kind=type==='Giriş / Alış'?'Tedarikçi':'Müşteri';
  el.innerHTML=D.accounts.filter(a=>a.kind===kind).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.code)} - ${esc(a.name)}</option>`).join('');
  if(!el.value && el.options.length)el.selectedIndex=0;
}
function movementMaterialPrice(){let m=D.materials.find(x=>x.id==v('mv_mat'));if(m)document.getElementById('mv_price').value=document.getElementById('mv_type').value==='Çıkış / Satış'?m.sale:m.purchase}
function saveMovement(i){
  if(i){
    let old=D.movements.find(x=>x.id===i); if(old)reverseMovement(old);
    let o={id:i,date:v('mv_date'),type:v('mv_type'),accountId:+v('mv_account'),materialId:+(movementDraft[0]?.materialId||0),qty:+(movementDraft[0]?.qty||0),price:+(movementDraft[0]?.price||0),vat:+v('mv_vat'),doc:v('mv_doc'),desc:v('mv_desc')};
    if(!o.accountId||!o.materialId||o.qty<=0){if(old)applyMovement(old);alert('İşlem için uygun cari, malzeme ve geçerli miktar seçin.');return}
    let a=D.accounts.find(x=>x.id===o.accountId);
    if((o.type==='Çıkış / Satış'&&a?.kind!=='Müşteri')||(o.type==='Giriş / Alış'&&a?.kind!=='Tedarikçi')){if(old)applyMovement(old);alert('Alış yalnızca tedarikçi, satış yalnızca müşteri carisine yapılabilir.');return}
    o.sub=o.qty*o.price;o.total=o.sub*(1+o.vat/100);applyMovement(o);D.movements=D.movements.map(x=>x.id===i?o:x);
  }else{
    let type=v('mv_type'),date=v('mv_date'),vat=+v('mv_vat')||0,doc=v('mv_doc'),desc=v('mv_desc');
    let accountId=+v('mv_account')||0;
    let kind=type==='Giriş / Alış'?'Tedarikçi':'Müşteri';
    let account=D.accounts.find(a=>a.id===accountId);
    let lines=(movementDraft||[]).map(x=>({...x,accountId}));
    if(!lines.length||!accountId||!account||lines.some(x=>!x.materialId||x.qty<=0)){alert('Cari seçin ve tüm ürün satırlarında malzeme ile geçerli miktar girin.');return}
    if(account.kind!==kind){alert(type==='Giriş / Alış'?'Alış yalnızca tedarikçi carisine yapılabilir.':'Satış yalnızca müşteri carisine yapılabilir.');return}
    lines.forEach(x=>{
      let o={id:id(),date,type,accountId,materialId:+x.materialId,qty:+x.qty,price:+x.price,vat,doc,desc};
      o.sub=o.qty*o.price;o.total=o.sub*(1+o.vat/100);applyMovement(o);D.movements.push(o)
    });
  }
  save();closeModal();content();
}
function applyMovement(m){
  let mat=D.materials.find(x=>x.id===m.materialId);
  if(mat)mat.stock+=(m.type==='Giriş / Alış'?Number(m.qty||0):-Number(m.qty||0));
  let a=D.accounts.find(x=>x.id===m.accountId);
  if(a){
    if(m.type==='Çıkış / Satış'&&a.kind!=='Müşteri')throw new Error('Satış işlemi yalnızca müşteri carisine yapılabilir.');
    if(m.type==='Giriş / Alış'&&a.kind!=='Tedarikçi')throw new Error('Alış işlemi yalnızca tedarikçi carisinden yapılabilir.');
    let delta=(m.type==='Çıkış / Satış')?Number(m.total||0):-Number(m.total||0);
    a.balance+=delta;
  }
}
function reverseMovement(m){
  let mat=D.materials.find(x=>x.id===m.materialId);
  if(mat)mat.stock-=(m.type==='Giriş / Alış'?Number(m.qty||0):-Number(m.qty||0));
  let a=D.accounts.find(x=>x.id===m.accountId);
  if(a){
    let delta=(m.type==='Çıkış / Satış')?Number(m.total||0):-Number(m.total||0);
    a.balance-=delta;
  }
}
function delMovement(i){let m=D.movements.find(x=>x.id===i);if(!m)return;if(confirm('Hareket silinsin mi? Stok ve cari bakiye geri alınacaktır.')){reverseMovement(m);D.movements=D.movements.filter(x=>x.id!==i);save();content()}}

function openQuote(i){let q=D.quotes.find(x=>x.id===i)||{no:'P-'+new Date().toISOString().slice(0,10).replaceAll('-',''),date:new Date().toISOString().slice(0,10),accountId:D.accounts.find(a=>a.kind==='Müşteri')?.id||'',valid:'',notes:'',items:[]};modal(`<h3>${i?'Teklif / Proforma Düzenle':'Yeni Teklif / Proforma'}</h3><div class="formgrid"><div class="field"><label>Müşteri</label><select id="q_account">${D.accounts.filter(a=>a.kind==='Müşteri').map(a=>`<option value="${a.id}" ${a.id===q.accountId?'selected':''}>${esc(a.code)} - ${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Teklif No</label><input id="q_no" value="${esc(q.no)}"></div><div class="field"><label>Tarih</label><input id="q_date" type="date" value="${q.date}"></div><div class="field"><label>Geçerlilik Tarihi</label><input id="q_valid" type="date" value="${q.valid}"></div></div><div class="toolbar"><button class="btn" onclick="openItemPicker()">+ Kalem Ekle</button></div><div class="quote-items" id="quoteItems"><div class="quote-row header"><span>Malzeme</span><span>Miktar</span><span>Birim Fiyat</span><span>KDV</span><span></span></div>${q.items.map((x,n)=>quoteRow(x,n)).join('')}</div><div class="field" style="margin-top:14px"><label>Notlar</label><textarea id="q_notes">${esc(q.notes)}</textarea></div><div class="quote-summary"><div class="summary-box" id="qsum"></div></div><div class="toolbar"><button class="btn" onclick="saveQuote(${i||0})">Teklifi Kaydet</button><button class="btn secondary" onclick="closeModal()">Vazgeç</button></div>`);window.quoteDraft={...q,items:q.items.map(x=>({...x}))};calcQuote()}
function quoteRow(x,n){let m=D.materials.find(z=>z.id===x.materialId)||{};return `<div class="quote-row" data-index="${n}"><span>${esc(m.code||'')} - ${esc(m.name||'')}</span><input type="number" step="0.01" value="${x.qty}" onchange="quoteDraft.items[${n}].qty=+this.value;calcQuote()"><input type="number" step="0.01" value="${x.price}" onchange="quoteDraft.items[${n}].price=+this.value;calcQuote()"><input type="number" step="0.01" value="${x.vat}" onchange="quoteDraft.items[${n}].vat=+this.value;calcQuote()"><button class="btn small danger" onclick="quoteDraft.items.splice(${n},1);refreshQuoteRows()">Sil</button></div>`}

function savePayment(){
  let type=v('p_type'),accountId=+v('p_account'),amount=+v('p_amount')||0,invoiceId=+v('p_invoice')||0;
  if(!accountId||amount<=0){alert('Cari ve geçerli bir tutar girin.');return}
  let a=D.accounts.find(x=>x.id===accountId);
  if(type==='Tahsilat'&&a.kind!=='Müşteri'){alert('Tahsilat işlemi müşteri carisinden yapılmalıdır.');return}
  if(type==='Ödeme'&&a.kind!=='Tedarikçi'){alert('Ödeme işlemi tedarikçi carisinden yapılmalıdır.');return}

  let inv=null;
  if(type==='Tahsilat' && invoiceId){
    inv=D.invoices.find(x=>x.id===invoiceId && x.accountId===accountId);
    if(!inv){alert('Seçilen fatura bu cariye ait değil.');return}
    let remaining=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
    if(remaining<=0){alert('Seçilen fatura zaten tamamen ödenmiş.');return}
    if(amount>remaining){
      if(!confirm(`Girilen tutar faturanın kalanından ${money(amount-remaining)} fazla. Faturaya yalnızca kalan tutar işlenecek. Devam edilsin mi?`))return;
      amount=remaining;
    }
  }

  if(type==='Tahsilat')a.balance-=amount;else a.balance+=amount;
  let p={id:id(),type,accountId,amount,date:v('p_date'),method:v('p_method'),note:v('p_note'),invoiceId};
  D.payments.push(p);

  if(inv){
    inv.paid=Math.min(Number(inv.total||0),Number(inv.paid||0)+amount);
  }

  save();closeModal();content();
}

function deleteInvoice(invoiceId){
  const inv=(D.invoices||[]).find(x=>x.id===invoiceId);
  if(!inv){ alert('Fatura bulunamadı.'); return; }

  const items=inv.items||inv.lines||[];
  const invoiceNo=inv.no||inv.number||'Fatura';

  if(!confirm(`"${invoiceNo}" silinecek. Faturaya ait tüm kalemler stoktan geri alınacak ve fatura hareketleri kaldırılacak. Devam edilsin mi?`)) return;

  // Önce faturanın oluşturduğu gerçek stok/cari hareketlerini geri al.
  const relatedMovements=(D.movements||[]).filter(m=>m.doc===invoiceNo || m.invoiceId===invoiceId);
  relatedMovements.forEach(m=>reverseMovement(m));

  // Eski/uyumsuz kayıt yapılarında hareket bulunamazsa, fatura kalemlerini
  // satış faturası kabul ederek stokları doğrudan geri ver.
  if(!relatedMovements.length){
    items.forEach(line=>{
      const mat=D.materials.find(m=>m.id===+line.materialId);
      if(mat) mat.stock=(+mat.stock||0)+(+line.qty||0);
    });
  }

  D.movements=(D.movements||[]).filter(m=>!(m.doc===invoiceNo || m.invoiceId===invoiceId));

  // Bu faturaya bağlı tahsilatları da kaldır ve cari bakiyeyi geri al.
  const linkedPayments=(D.payments||[]).filter(p=>p.invoiceId===invoiceId);
  linkedPayments.forEach(p=>{
    const a=D.accounts.find(x=>x.id===p.accountId);
    if(!a) return;
    if(p.type==='Tahsilat') a.balance += Number(p.amount||0);
    else if(p.type==='Ödeme') a.balance -= Number(p.amount||0);
  });
  D.payments=(D.payments||[]).filter(p=>p.invoiceId!==invoiceId);

  D.invoices=D.invoices.filter(x=>x.id!==invoiceId);

  save();
  content();
  alert('Fatura silindi. Tüm kalemlerin stokları iade edildi.');
}

function deletePayment(paymentId){
  const p=(D.payments||[]).find(x=>x.id===paymentId);
  if(!p){ alert('Tahsilat/ödeme kaydı bulunamadı.'); return; }

  const label=p.type==='Tahsilat'?'Tahsilat':'Ödeme';
  const amount=Number(p.amount||0);
  const inv=p.invoiceId ? (D.invoices||[]).find(x=>x.id===p.invoiceId) : null;
  const invText=inv ? ` Fatura ${inv.no} üzerindeki ödeme de geri alınacaktır.` : '';
  if(!confirm(`${label} kaydı silinecek.${invText} Cari bakiye de geri düzeltilecek. Devam edilsin mi?`)) return;

  const a=D.accounts.find(x=>x.id===p.accountId);
  if(a){
    if(p.type==='Tahsilat') a.balance += amount;
    else if(p.type==='Ödeme') a.balance -= amount;
  }

  if(inv && p.type==='Tahsilat'){
    inv.paid=Math.max(0,Number(inv.paid||0)-amount);
  }

  D.payments=D.payments.filter(x=>x.id!==paymentId);
  save();
  content();
  alert(`${label} kaydı silindi.`);
}

function fillAllBalance(){
  const type=v('p_type');
  const accountId=+v('p_account')||0;
  const amountEl=document.getElementById('p_amount');
  if(!amountEl || !accountId) return;

  const a=D.accounts.find(x=>x.id===accountId);
  if(!a) return;

  // Cari bakiye yönü: Müşteri alacağı pozitif, Tedarikçi borcu negatiftir.
  // Bu nedenle Ödeme ekranında borcun mutlak değeri kullanılmalıdır.
  let balance=type==='Ödeme'
    ? Math.max(0, -Number(a.balance||0))
    : Math.max(0, Number(a.balance||0));

  // Tahsilat faturaya bağlıysa, fatura kalanını aşma.
  const invoiceId=+v('p_invoice')||0;
  if(type==='Tahsilat' && invoiceId){
    const inv=D.invoices.find(x=>x.id===invoiceId);
    if(inv){
      const remaining=Math.max(0,Number(inv.total||0)-Number(inv.paid||0));
      balance=Math.min(balance,remaining);
    }
  }

  amountEl.value=balance.toFixed(2);
}
</script>
